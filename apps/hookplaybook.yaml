id: hookplaybook
name: HookPlaybook
mcp_url: https://hookplaybook.com/api/v1/mcp
# The same value as HookPlaybook's ASSISTANT_TOKEN_SECRET.
secret_env: HOOKPLAYBOOK_SESSION_SECRET
# The dashboard is at /dashboard on the same origin.
allowed_origins: ["https://hookplaybook.com"]
message_usd_cap: 0.10

guide: |
  HookPlaybook helps people grow on X by posting about real things they did.
  A good story has what happened, who it helps or why it matters, and a number or result
  (how many, how fast, what changed) when there is one. What they learned makes it stronger,
  and a screenshot they can share makes it more believable.
  Only use what the person tells you or shows you. Never invent a number or a result.

writes:
  - kind: x_post
    count: 1
    max_chars: 280
    no_links: true
    no_dashes: true
    may_carry_image: true
    instructions: |
      Write a post for X in the user's own voice, opening with one of their winning hook shapes
      (the patterns that work) when one fits.
      Make one point, using facts from the list, in plain words.
  - kind: x_thread
    count: 1
    max_chars: 280
    max_posts: 8
    no_links: true
    no_dashes: true
    may_carry_image: true
    instructions: |
      Write a thread for X in the user's own voice. Open the first post with one of their winning hook shapes
      when one fits. Then one point per post, using facts from the list, in plain words.
      The first post may carry the image.

# Saving goes through save_draft only: it is the one HookPlaybook tool that copies a picture into the draft.
tools:
  context: assistant_context
  save_draft: save_draft
  save_material: save_material
  charge: assistant_charge

models:
  chat: anthropic/claude-sonnet-5.5
  chat_reasoning: low  # Sonnet 5.5 always thinks; low is its fastest
  writer: anthropic/claude-sonnet-5.5
  writer_reasoning: low
  main: openai/gpt-6-luna
  cheap: openai/gpt-6-luna
  vision: openai/gpt-6-luna
  fallbacks: [anthropic/claude-haiku-5.5, openai/gpt-6-luna]

files:
  image_mb: 5 # HookPlaybook's own limit for a picture
  pdf_mb: 20
  pdf_pages: 10 # a scanned page is one vision call: 10 (4 at a time) stay well inside Vercel's 300 s
  voice_seconds: 300
  per_message: 5
  kinds: [image, pdf, voice]
