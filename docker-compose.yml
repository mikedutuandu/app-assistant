# `docker compose up --build` gives a working bot at http://localhost:8000, the demo app at /demo included, with no cloud
# account: Postgres 16 and the files on local disk (the `assistant-data` volume).
#
# OPENROUTER_API_KEY is needed for real replies (export it or put it in a `.env` file next to this one). The
# DEMO_SESSION_SECRET default below is for trying it on your own machine: set your own before the bot is reachable by
# anyone else (`openssl rand -hex 32`), and set PUBLIC_BASE_URL to its public address: the bot refuses to start with
# this placeholder while PUBLIC_BASE_URL is not localhost. The port is bound to this machine only.
services:
  bot:
    build: .
    ports:
      - "127.0.0.1:8000:8000"  # this machine only; see docs/DEPLOY.md to publish it
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DATABASE_URL: postgresql://assistant:assistant@postgres:5432/assistant
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      DATA_DIR: /data
      FILES_SIGNING_KEY: ${FILES_SIGNING_KEY:-}
      DEMO_SESSION_SECRET: ${DEMO_SESSION_SECRET:-local-demo-secret-change-before-you-expose-this-bot}
    volumes:
      - assistant-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant
      POSTGRES_DB: assistant
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  assistant-data:
  postgres-data:
