# The npm package @app-assistant/host (sdk/js): tested on every pull request that touches it, published when a push
# to main changes sdk/js/package.json to a version that isn't on npm yet. Publishing needs the repository secret
# NPM_TOKEN (an npm automation token for the @app-assistant scope); until it is set, the publish job says so and passes.
name: sdk

on:
  pull_request:
    paths:
      - "sdk/**"
      - "tests/contract/scenarios.json"
      - ".github/workflows/sdk.yml"
  push:
    branches: [main]
    paths:
      - "sdk/js/package.json"

permissions:
  contents: read

defaults:
  run:
    working-directory: sdk/js

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/js/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Two quick version bumps publish one after the other, never racing.
    concurrency:
      group: sdk-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/js/package-lock.json
          registry-url: https://registry.npmjs.org
      - name: Is this version new, and can it be published?
        id: check
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          # An existing version prints itself; an unknown version prints nothing; an unknown package is E404.
          if out=$(npm view "$name@$version" version 2>&1); then
            if [ -n "$out" ]; then
              echo "::notice::$name@$version is already on npm: nothing to publish."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif ! grep -q E404 <<< "$out"; then
            echo "$out"
            echo "::error::Could not ask npm whether $name@$version exists."
            exit 1
          fi
          if [ -z "$NPM_TOKEN" ]; then
            echo "::notice::$name@$version is not published: add the repository secret NPM_TOKEN, then re-run this workflow."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.publish == 'true'
        run: npm ci
      - if: steps.check.outputs.publish == 'true'
        run: npm test
      - if: steps.check.outputs.publish == 'true'
        run: npm run build
      - name: Publish
        if: steps.check.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # npm makes provenance only for a public source repository; a private one publishes without it.
          PROVENANCE: ${{ github.event.repository.private && '--no-provenance' || '--provenance' }}
        run: npm publish --access public "$PROVENANCE" --ignore-scripts
